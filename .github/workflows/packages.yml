name: Swift Packages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packages:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2027.0.1-09-17.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Correlate exact source and check metadata
        run: bash scripts/repo-enforce.sh
      - name: Resolve, build, and test packages; build app when present
        run: bash scripts/validate-packages.sh
      - name: iOS application and recovery UI tests
        id: ui
        env:
          FLICK_UI_TEST_DIR: ${{ runner.temp }}/flick-ui
        run: bash scripts/test-ios.sh
      - name: Preserve UI evidence for the exact candidate
        if: ${{ always() && steps.ui.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flick-ui-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flick-ui/Flick.xcresult
            ${{ runner.temp }}/flick-ui/xcodebuild.log
            ${{ runner.temp }}/flick-ui/environment.txt
            ${{ runner.temp }}/flick-ui/appearance-fixture.log
          retention-days: 7
          if-no-files-found: error
