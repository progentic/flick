name: Swift Packages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packages:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-09-16
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Correlate exact source and check metadata
        run: bash scripts/repo-enforce.sh
      - name: Resolve, build, and test packages; build app when present
        run: bash scripts/validate-packages.sh
      - name: iOS application and recovery UI tests
        id: ui
        env:
          FLICK_UI_TEST_DIR: ${{ runner.temp }}/flick-ui
        run: bash scripts/test-ios.sh
      - name: Diagnose contrast audit on a fresh Dark simulator
        if: ${{ failure() && steps.ui.outcome == 'failure' }}
        env:
          FLICK_UI_TEST_DIR: ${{ runner.temp }}/flick-ui-audit-diagnostic
        run: |
          # Additional diagnostic only: the failed full-suite gate stays failed.
          # No filtered run can substitute for the required 12/12 suite above.
          if ! grep -q 'testDarkFeedAndAccessibilityAudit.*Contrast failed' "${RUNNER_TEMP}/flick-ui/xcodebuild.log"; then
            echo 'NOT_APPLICABLE: the full suite did not report the timestamp contrast discrepancy'
            exit 0
          fi
          device="$(xcrun simctl create Flick-Audit-Diagnostic com.apple.CoreSimulator.SimDeviceType.iPhone-17e com.apple.CoreSimulator.SimRuntime.iOS-26-5)"
          trap 'xcrun simctl delete "$device"' EXIT
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance dark
          bash scripts/test-ios.sh "$device" -only-testing:FlickUITests/FlickUITests/testDarkFeedAndAccessibilityAudit
      - name: Preserve UI evidence for the exact candidate
        if: ${{ always() && steps.ui.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flick-ui-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flick-ui/Flick.xcresult
            ${{ runner.temp }}/flick-ui/xcodebuild.log
            ${{ runner.temp }}/flick-ui/environment.txt
            ${{ runner.temp }}/flick-ui/appearance-fixture.log
            ${{ runner.temp }}/flick-ui-audit-diagnostic/Flick.xcresult
            ${{ runner.temp }}/flick-ui-audit-diagnostic/xcodebuild.log
            ${{ runner.temp }}/flick-ui-audit-diagnostic/environment.txt
            ${{ runner.temp }}/flick-ui-audit-diagnostic/appearance-fixture.log
          retention-days: 7
          if-no-files-found: error
